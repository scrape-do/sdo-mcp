# SPDX-License-Identifier: Apache-2.0
# Keeps Go modules and the SHA-pinned actions current. The cooldown lets a new
# release age a week before it is proposed, so a compromised or broken release
# is usually caught and pulled before it reaches this repository.
version: 2

# The gomod update can only succeed once the sdo-go version go.mod requires is
# tagged.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
