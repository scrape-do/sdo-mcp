# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so drift from sdo-cli's copies of internal/mcp and internal/explain
  # surfaces even when this repository is quiet.
  schedule:
    - cron: "41 5 * * 1"

permissions: {}

# Every job runs on GitHub-hosted runners: free for a public repository, a
# clean image every time, and no code from outside the org ever reaches the
# org's persistent self-hosted runners. CodeQL is the one exception: its result
# upload and its own status calls are GitHub API requests, which the org's IP
# allow list only accepts from the self-hosted runners, so it runs there for
# same-repository events only; a pull request from a fork is not analysed
# (its code must not reach those runners) and is analysed on main once merged.
#
# go.mod pins the sdo-go SDK to a released version and go.sum verifies it, so
# every job builds against exactly that version from the module proxy.

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ["1.26", "1.27"] # go.mod's minimum, and the current release
        include:
          - { os: macos-latest, go: "1.27" }
          - { os: windows-latest, go: "1.27" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true # the newest patch release, not one cached on the runner
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o sdo-mcp ./cmd/sdo-mcp

  # Format, install name, hermeticity, the coverage floor and the workflow
  # lint run once, on Linux, not across the OS matrix: the scripts are bash
  # (Windows runners default to PowerShell) and a CRLF checkout on Windows would
  # make gofmt flag every file. The floor is 99%.
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt: $unformatted" >&2
            gofmt -d .
            exit 1
          fi
      # `go install <module>/cmd/sdo-mcp@version` must give users a binary named
      # sdo-mcp: Go names it after the package directory.
      - name: go install produces an sdo-mcp binary
        run: |
          GOBIN="$RUNNER_TEMP/gobin" go install ./cmd/sdo-mcp
          test -x "$RUNNER_TEMP/gobin/sdo-mcp" || { echo "::error::go install did not produce a binary named sdo-mcp" >&2; exit 1; }
      # The suite must not depend on the runner's (or a developer's) Scrape.do
      # settings: TestMain clears them, and this proves it.
      - name: Tests are hermetic under hostile SDO_* settings
        env:
          SDO_TOKEN: hostile-token-value
          SDO_BASE_URL: http://hostile.invalid
          SDO_ASYNC_BASE_URL: http://hostile.invalid
          SDO_TIMEOUT: abc
        run: go test ./...
      - name: Coverage floor (99%)
        run: |
          go test -coverprofile=coverage.out ./...
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "total coverage: $pct%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 99) ? 0 : 1 }' || {
            echo "::error::coverage $pct% is below the 99% floor" >&2; exit 1; }
      # The workflows themselves: actionlint checks every job, expression and
      # action input, and runs shellcheck (shipped with the runner image) on
      # every run: script. It reads .github/actionlint.yaml. A version-pinned,
      # checksum-verified release, like gitleaks in security.yml.
      - name: Lint the workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # Regenerate the command-line + MCP compat surface and fail on any drift from
  # the committed api-surface.txt. Any add/remove/rename of a command, flag, MCP
  # tool or tool parameter must come with a regenerated golden.
  api-surface:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - name: Check the command-line + MCP surface for drift
        run: |
          go run ./tools/apisurface > api-surface.txt
          if ! git diff --exit-code api-surface.txt; then
            echo "::error::Command-line/MCP surface changed. Regenerate with 'go run ./tools/apisurface > api-surface.txt' and commit api-surface.txt." >&2
            exit 1
          fi

  # sdo-cli ships its own copies of internal/mcp and internal/explain for
  # `sdo mcp serve`. They are kept identical apart from the module path and
  # internal/mcp/branding.go, so a fix made in one repository is not silently
  # missing from the other. A pull request only gets a warning (the matching
  # sdo-cli change may still be in review); a push to main and the weekly run
  # fail on drift.
  mcp-copy-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scrape-do/sdo-cli
          path: sdo-cli
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache: false
      - name: Compare internal/mcp and internal/explain with sdo-cli's copies
        run: |
          drift=()
          for pkg in mcp explain; do
            copy="$(mktemp -d "$RUNNER_TEMP/$pkg-copy.XXXXXX")"
            cp -R "sdo-cli/internal/$pkg/." "$copy"
            find "$copy" -name '*.go' -exec sed -i 's#github.com/scrape-do/sdo-cli/internal/#github.com/scrape-do/sdo-mcp/internal/#g' {} +
            gofmt -w "$copy" # the renamed imports may sort differently
            exclude=()
            if [ "$pkg" = mcp ]; then exclude=(-x branding.go); fi
            if diff -ru "${exclude[@]}" "internal/$pkg" "$copy"; then
              echo "internal/$pkg matches sdo-cli's copy"
            else
              drift+=("internal/$pkg")
            fi
          done
          if [ "${#drift[@]}" -eq 0 ]; then
            exit 0
          fi
          msg="${drift[*]} differs from sdo-cli's copy (beyond the module path and internal/mcp/branding.go); mirror the change in the other repository"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "::warning::$msg"
          else
            echo "::error::$msg" >&2
            exit 1
          fi

  # Every commit of a pull request needs a Conventional Commit subject and a DCO
  # sign-off (see CONTRIBUTING.md).
  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Conventional Commit subjects and DCO sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s\n' "$subject" | grep -qE '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9][a-z0-9/_.-]*\))?!?: .+'; then
              echo "::error::$sha: not a Conventional Commit subject: $subject"; fail=1
            fi
            # Bots (Dependabot) cannot certify the DCO; everyone else signs off.
            case "$(git log -1 --format=%ae "$sha")" in *'[bot]@users.noreply.github.com') continue ;; esac
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::$sha: missing Signed-off-by trailer (commit with git commit -s)"; fail=1
            fi
          done
          exit "$fail"

  codeql:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      # The persistent runners may still hold root-owned files that an older,
      # container-based job left in this workspace or in the runner's temp
      # directory (CodeQL writes its PR diff range there); reclaim both.
      - name: Reclaim the workspace
        working-directory: ${{ github.workspace }}
        run: docker run --rm -v "$PWD:/w" -v "$RUNNER_TEMP:/t" busybox:1.37.0@sha256:66a6306db78bf2dbf3487f293aa8d6990d8e506fdffab9cc43fe422becf886e4 chown -R "$(id -u):$(id -g)" /w /t
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: go
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
